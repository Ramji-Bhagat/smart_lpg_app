name: smart_lpg_app
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  all: ^0.0.3
  firebase_core: ^4.4.0
  firebase_auth: ^6.3.0
  firebase_database: ^12.1.3 
  cloud_firestore: ^6.1.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  google_sign_in: ^7.2.0
  intl: ^0.20.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0



flutter:
  uses-material-design: true

  
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter_native_splash:
  color: "#3A7BD5"
  image: assets/logo.png
  android: true
  ios: true
  fullscreen: true